<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password — Smart Interview Practice Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <nav class="site-nav">
      <div class="wrap">
        <a href="index.html" class="brand">
          <span class="brand-mark">SI</span>
          <span class="brand-name">Smart Interview Practice Portal</span>
        </a>
      </div>
    </nav>
    <main class="auth-form-col">
      <section class="auth-form">
        <h1>Choose a new password</h1>
        <p>Use at least 8 characters. This reset link can only be used once.</p>
        <form id="resetPasswordForm" novalidate>
          <div class="field">
            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <p id="resetMessage" class="status-message" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetPasswordButton">Update password</button>
        </form>
        <p class="auth-switch"><a href="login.html">Back to login</a></p>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('newPassword');
    const confirmInput = document.getElementById('confirmPassword');
    const message = document.getElementById('resetMessage');
    const button = document.getElementById('resetPasswordButton');
    const token = new URLSearchParams(window.location.hash.slice(1)).get('token') || '';
    if (token) window.history.replaceState(null, document.title, window.location.pathname);
    let resetSucceeded = false;

    function showMessage(text, success) {
      message.className = `status-message ${success ? 'status-success' : 'status-error'}`;
      message.textContent = text;
      message.hidden = false;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.hidden = true;
      if (!token) {
        showMessage('This reset link is missing its token. Request a new password reset link.', false);
        return;
      }
      if (passwordInput.value.length < 8) {
        passwordInput.setCustomValidity('Your password must be at least 8 characters.');
        passwordInput.reportValidity();
        passwordInput.setCustomValidity('');
        return;
      }
      if (passwordInput.value !== confirmInput.value) {
        confirmInput.setCustomValidity('The passwords do not match.');
        confirmInput.reportValidity();
        confirmInput.setCustomValidity('');
        return;
      }

      button.disabled = true;
      try {
        const result = await Api.resetPassword({ token, password: passwordInput.value });
        resetSucceeded = true;
        showMessage(result.message, true);
        form.querySelectorAll('input').forEach((input) => { input.disabled = true; });
        button.textContent = 'Password updated';
        button.hidden = true;
      } catch (error) {
        showMessage(error.message, false);
      } finally {
        if (!resetSucceeded) button.disabled = false;
      }
    });
  </script>
</body>
</html>
