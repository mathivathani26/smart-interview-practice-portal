<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Question — Smart Interview Practice Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
      <nav>
        <a href="dashboard.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
        <a href="mock-drive.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Mock Drive</a>
        <a href="practice.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>Single Practice</a>
        <a href="leaderboard.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>Leaderboard</a>
        <a href="history.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>History</a>
        <a href="admin.html" class="side-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>Admin</a>
      </nav>
      <div class="side-user">
        <span class="avatar" id="sideAvatar">--</span>
        <div><strong id="sideName">Loading…</strong><small id="sideEmail"></small></div>
      </div>
      <button class="side-logout" data-logout>Log out</button>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <h1>Add Question</h1>
          <div class="sub">Create a new aptitude, coding, or theory question.</div>
        </div>
        <a href="admin.html" class="btn btn-ghost">Back to Admin</a>
      </div>

      <div class="panel">
        <div class="field">
          <label for="qBank">Question bank</label>
          <select id="qBank">
            <option value="aptitude">Aptitude</option>
            <option value="coding">Coding</option>
            <option value="theory">Theory</option>
          </select>
        </div>

        <div data-bank-fields="aptitude">
          <div class="field">
            <label for="aCategory">Category</label>
            <select id="aCategory">
              <option value="quantitative">Quantitative</option>
              <option value="logical">Logical</option>
              <option value="verbal">Verbal</option>
            </select>
          </div>
          <div class="field">
            <label for="aText">Question text</label>
            <textarea id="aText" rows="3" placeholder="Enter question statement"></textarea>
          </div>
          <div class="field">
            <label for="aExplanation">Explanation</label>
            <textarea id="aExplanation" rows="3" placeholder="Explain why the correct option is correct"></textarea>
          </div>

          <div class="field">
            <label>Options</label>
            <div class="aptitude-option-list" id="aptitudeOptionList">
              <div class="option-row">
                <input type="text" class="aptitude-option-input" placeholder="Option A" />
                <label class="inline-check"><input type="checkbox" class="correct-option-checkbox" /> Correct</label>
              </div>
              <div class="option-row">
                <input type="text" class="aptitude-option-input" placeholder="Option B" />
                <label class="inline-check"><input type="checkbox" class="correct-option-checkbox" /> Correct</label>
              </div>
              <div class="option-row">
                <input type="text" class="aptitude-option-input" placeholder="Option C" />
                <label class="inline-check"><input type="checkbox" class="correct-option-checkbox" /> Correct</label>
              </div>
              <div class="option-row">
                <input type="text" class="aptitude-option-input" placeholder="Option D" />
                <label class="inline-check"><input type="checkbox" class="correct-option-checkbox" /> Correct</label>
              </div>
            </div>
          </div>
        </div>

        <div data-bank-fields="coding" style="display:none;">
          <div class="field">
            <label for="cTitle">Title</label>
            <input id="cTitle" placeholder="e.g. Valid Parentheses" />
          </div>
          <div class="field">
            <label for="cDesc">Description</label>
            <textarea id="cDesc" rows="3" placeholder="Describe the problem statement"></textarea>
          </div>
          <div class="field-row">
            <div class="field"><label for="cInputFormat">Input format</label><textarea id="cInputFormat" rows="2"></textarea></div>
            <div class="field"><label for="cOutputFormat">Output format</label><textarea id="cOutputFormat" rows="2"></textarea></div>
          </div>
          <div class="field"><label for="cConstraints">Constraints (one per line)</label><textarea id="cConstraints" rows="3"></textarea></div>
          <div class="field-row">
            <div class="field"><label for="cSampleInput">Sample input</label><textarea id="cSampleInput" rows="2"></textarea></div>
            <div class="field"><label for="cSampleOutput">Sample output</label><textarea id="cSampleOutput" rows="2"></textarea></div>
          </div>
          <div class="field">
            <label for="cTags">Tags (comma-separated)</label>
            <input id="cTags" placeholder="arrays, stack, string" />
          </div>
          <div class="field">
            <label for="cStarterPy">Python 3 starter code</label>
            <textarea id="cStarterPy" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="cStarterC">C starter code</label>
            <textarea id="cStarterC" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="cStarterJs">JavaScript starter code</label>
            <textarea id="cStarterJs" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="cStarterCpp">C++ starter code</label>
            <textarea id="cStarterCpp" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="cStarterJava">Java starter code</label>
            <textarea id="cStarterJava" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="cTests">Test cases</label>
            <textarea id="cTests" rows="4" placeholder="1 2 3 | 6
2 4 | 6"></textarea>
          </div>
        </div>

        <div data-bank-fields="theory" style="display:none;">
          <div class="field">
            <label for="tSubject">Subject</label>
            <input id="tSubject" placeholder="Operating Systems" />
          </div>
          <div class="field">
            <label for="tText">Question text</label>
            <textarea id="tText" rows="3" placeholder="What is the difference between...?"></textarea>
          </div>
          <div class="field">
            <label for="tConcepts">Ideal concepts (comma-separated)</label>
            <input id="tConcepts" placeholder="context switching, thread, memory" />
          </div>
          <div class="field">
            <label for="tReference">Reference answer</label>
            <textarea id="tReference" rows="5" placeholder="A concise technically correct answer"></textarea>
          </div>
          <div class="field">
            <label for="tRubric">Marking rubric (one criterion per line)</label>
            <textarea id="tRubric" rows="4" placeholder="Correctly explains the key mechanism"></textarea>
          </div>
          <div class="field">
            <label for="tMaxMarks">Maximum marks</label>
            <input id="tMaxMarks" type="number" min="1" step="1" value="10">
          </div>
        </div>

        <div class="field">
          <label for="qDiff">Difficulty</label>
          <select id="qDiff">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
        </div>

        <p id="formError" class="error-text" style="display:none;"></p>

        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" type="button" id="saveQuestionBtn">Save Question</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.requireAdmin();

    const qBank = document.getElementById('qBank');
    const errorEl = document.getElementById('formError');

    function syncBankFields() {
      const selected = qBank.value;
      document.querySelectorAll('[data-bank-fields]').forEach((panel) => {
        panel.style.display = panel.dataset.bankFields === selected ? '' : 'none';
      });
    }

    qBank.addEventListener('change', syncBankFields);
    document.getElementById('cancelBtn').addEventListener('click', () => {
      window.location.href = 'admin.html';
    });

    function collectAptitudePayload() {
      const questionText = document.getElementById('aText').value.trim();
      const rows = [...document.querySelectorAll('.aptitude-option-input')];
      const entries = rows.map((row, index) => ({
        text: row.value.trim(),
        checked: row.closest('.option-row').querySelector('.correct-option-checkbox').checked,
        index,
      })).filter((entry) => entry.text);

      if (!questionText) throw new Error('Question text is required.');
      if (entries.length < 2) throw new Error('At least two options are required.');
      const correctOptions = entries.filter((entry) => entry.checked).map((entry) => entry.text);
      if (!correctOptions.length) throw new Error('Select at least one correct option.');
      return {
        category: document.getElementById('aCategory').value,
        question_text: questionText,
        options: entries.map((entry) => entry.text),
        correct_options: correctOptions,
        difficulty: document.getElementById('qDiff').value,
        explanation: document.getElementById('aExplanation').value.trim(),
      };
    }

    async function submitQuestion() {
      errorEl.style.display = 'none';
      const bank = qBank.value;

      try {
        if (bank === 'aptitude') {
          const payload = collectAptitudePayload();
          await Api.admin.createAptitude(payload);
        } else if (bank === 'coding') {
          const starter_code = {};
          const py = document.getElementById('cStarterPy').value.trim();
          const c = document.getElementById('cStarterC').value.trim();
          const js = document.getElementById('cStarterJs').value.trim();
          const cpp = document.getElementById('cStarterCpp').value.trim();
          const java = document.getElementById('cStarterJava').value.trim();
          if (py) starter_code.python3 = py;
          if (c) starter_code.c = c;
          if (js) starter_code.javascript = js;
          if (cpp) starter_code.cpp = cpp;
          if (java) starter_code.java = java;

          const testCases = document.getElementById('cTests').value
            .split('\n')
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => {
              const [input, expected_output = ''] = line.split('|').map((part) => part.trim());
              return { input, expected_output, hidden: false };
            });

          await Api.admin.createCoding({
            title: document.getElementById('cTitle').value.trim(),
            description: document.getElementById('cDesc').value.trim(),
            input_format: document.getElementById('cInputFormat').value.trim(),
            output_format: document.getElementById('cOutputFormat').value.trim(),
            constraints: document.getElementById('cConstraints').value.split('\n').map((item) => item.trim()).filter(Boolean),
            sample_input: document.getElementById('cSampleInput').value,
            sample_output: document.getElementById('cSampleOutput').value,
            tags: document.getElementById('cTags').value.split(',').map((tag) => tag.trim()).filter(Boolean),
            starter_code,
            test_cases: testCases,
            difficulty: document.getElementById('qDiff').value,
          });
        } else {
          const questionText = document.getElementById('tText').value.trim();
          const subject = document.getElementById('tSubject').value.trim();
          if (!subject || !questionText) throw new Error('Subject and question text are required.');
          await Api.admin.createTheory({
            subject,
            question_text: questionText,
            ideal_concepts: document.getElementById('tConcepts').value.split(',').map((item) => item.trim()).filter(Boolean),
            reference_answer: document.getElementById('tReference').value.trim(),
            marking_rubric: document.getElementById('tRubric').value.split('\n').map((item) => item.trim()).filter(Boolean),
            max_marks: Number(document.getElementById('tMaxMarks').value),
            difficulty: document.getElementById('qDiff').value,
          });
        }

        window.location.href = 'admin.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }

    document.getElementById('saveQuestionBtn').addEventListener('click', submitQuestion);
    syncBankFields();
  </script>
</body>
</html>
