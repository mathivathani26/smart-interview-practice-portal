<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="mock-drive.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mock Drive
      </a>
      <a href="practice.html" class="side-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Single Practice
      </a>
      <a href="leaderboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        Leaderboard
      </a>
      <a href="history.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        History
      </a>
      <a href="admin.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>
        Admin
      </a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong style="color:var(--on-navy);" id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Session result</h1>
        <div class="sub" id="resultSub">Loading…</div>
      </div>
      <a href="practice.html" class="btn btn-primary">Next question →</a>
    </div>

    <div class="panel" style="display:flex; gap:34px; align-items:center; flex-wrap:wrap;">
      <svg class="score-ring" id="scoreRing" data-ring data-score="0" viewBox="0 0 140 140" style="width:140px; height:140px; flex-shrink:0;">
        <circle class="track" cx="70" cy="70" r="55" stroke-width="10"></circle>
        <circle class="fill" cx="70" cy="70" r="55" stroke-width="10" transform="rotate(-90 70 70)"></circle>
        <text class="ring-value" x="70" y="66" text-anchor="middle" font-size="30">0%</text>
        <text x="70" y="86" text-anchor="middle" fill="var(--ink-faint)" font-family="var(--font-mono)">overall</text>
      </svg>
      <div>
        <h3 style="margin-bottom:6px;" id="headline">—</h3>
        <p style="margin-bottom:0; max-width:52ch;" id="summaryText"></p>
        <div style="display:flex; gap:30px; margin-top:14px; flex-wrap:wrap;">
          <div class="mono result-metric" style="color:var(--ink-faint);">Jaccard similarity<br><b id="jaccardVal" style="font-family:var(--font-display); color:var(--ink);">—</b></div>
          <div class="mono result-metric" style="color:var(--ink-faint);">TF‑IDF cosine<br><b id="tfidfVal" style="font-family:var(--font-display); color:var(--ink);">—</b></div>
          <div class="mono result-metric" style="color:var(--ink-faint);">Concepts matched<br><b id="conceptsVal" style="font-family:var(--font-display); color:var(--ink);">—</b></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Your answer</h3></div>
      <div class="legend">
        <span><i class="hit"></i>Matched concept</span>
        <span><i class="miss"></i>Missing concept</span>
      </div>
      <p style="line-height:1.85;" id="answerText"></p>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Concepts matched</h3><span class="pill strong" id="matchedCount">0</span></div>
        <div class="concept-list" id="matchedList"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Concepts missing</h3><span class="pill weak" id="missingCount">0</span></div>
        <div class="concept-list" id="missingList"></div>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  Auth.requireAuth();
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session');

  (async function load() {
    if (!sessionId) { document.getElementById('answerText').textContent = 'No session specified.'; return; }
    try {
      const { session, round_attempts } = await Api.getSession(sessionId);
      const attempt = round_attempts[0];
      if (!attempt) { document.getElementById('answerText').textContent = 'No answer found for this session.'; return; }

      document.getElementById('resultSub').textContent = `${attempt.category} · ${attempt.difficulty}`;

      const ring = document.getElementById('scoreRing');
      ring.dataset.score = attempt.round_score;
      drawRing(ring);

      const missingCount = (attempt.missing_concepts || []).length;
      document.getElementById('headline').textContent = missingCount === 0 ? 'Full coverage — nice work.' : `Solid attempt — ${missingCount} concept${missingCount === 1 ? '' : 's'} missing.`;
      document.getElementById('summaryText').textContent = missingCount === 0
        ? 'You covered every key concept the scoring engine looked for.'
        : `Add: ${attempt.missing_concepts.join(', ')} to make this interview-ready.`;

      document.getElementById('jaccardVal').textContent = attempt.jaccard_score;
      document.getElementById('tfidfVal').textContent = attempt.tfidf_score;
      document.getElementById('conceptsVal').textContent = `${attempt.matched_concepts.length} / ${attempt.matched_concepts.length + attempt.missing_concepts.length}`;

      document.getElementById('answerText').textContent = attempt.response.answer_text;

      document.getElementById('matchedCount').textContent = attempt.matched_concepts.length;
      document.getElementById('matchedList').innerHTML = attempt.matched_concepts.map(c => `<span class="concept-chip hit">${c}</span>`).join('') || '<span style="color:var(--ink-faint);">None matched</span>';

      document.getElementById('missingCount').textContent = attempt.missing_concepts.length;
      document.getElementById('missingList').innerHTML = attempt.missing_concepts.map(c => `<span class="concept-chip miss">${c}</span>`).join('') || '<span style="color:var(--ink-faint);">Nothing missing</span>';
    } catch (err) {
      document.getElementById('answerText').textContent = err.message;
    }
  })();
</script>
</body>
</html>
