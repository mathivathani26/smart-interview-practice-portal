<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Round — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="mock-drive.html" class="side-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mock Drive
      </a>
      <a href="practice.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Single Practice
      </a>
      <a href="leaderboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        Leaderboard
      </a>
      <a href="history.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        History
      </a>
      <a href="admin.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>
        Admin
      </a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong style="color:var(--on-navy);" id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1 id="driveTitle">Mock Drive</h1>
        <div class="sub" id="roundSub">Loading…</div>
      </div>
      <span class="proctor-badge" data-proctor-badge><span class="dot"></span><span class="proctor-label">Proctoring active</span></span>
    </div>

    <div class="stepper" id="stepper"></div>
    <p id="loadingMsg" style="color:var(--ink-faint);">Loading problem…</p>

    <div class="code-shell" id="codeShell" style="display:none;">
      <div>
        <div class="panel" style="margin-bottom:16px;">
          <div class="q-meta" style="margin-bottom:10px;">
            <span class="timer"><span class="dot"></span><span id="roundTimer">15:00</span></span>
            <span class="pill info" id="qDifficulty"></span>
          </div>
          <h2 id="qTitle"></h2>
          <div class="problem-desc">
            <p id="qDescription"></p>
            <div class="tag-row" id="qTags"></div>
            <div id="problemDetails" style="margin-top:16px;"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Test Cases</h3>
            <div style="display:flex; gap:8px; align-items:center;">
              <span class="proctor-badge" id="pasteBadge" style="display:none;"><span class="dot"></span><span></span></span>
              <span id="mockNotice" class="pill weak" style="display:none;">Simulated results &mdash; no local interpreter/Judge0 for this language</span>
            </div>
          </div>
          <div class="testcase-list" id="testcaseList"></div>
        </div>
      </div>

      <div>
        <div class="code-panel">
          <div class="code-panel-head">
            <span>solution</span>
            <select id="languageSelect">
              <option value="python3">Python 3</option>
              <option value="cpp">C++</option>
              <option value="java">Java</option>
              <option value="javascript">JavaScript</option>
            </select>
          </div>
          <div id="monacoContainer" style="height:340px;"></div>
          <textarea class="code-editor" id="codeEditorFallback" spellcheck="false" style="display:none;"></textarea>
        </div>
        <p id="submitError" class="error-text" style="display:none; margin-top:10px;"></p>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn btn-ghost" id="runCodeBtn">Run Code</button>
          <button class="btn btn-primary" id="nextBtn" style="margin-left:auto;">Submit &amp; Continue →</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/drive.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>
<script>
  Auth.requireAuth();
  const state = Drive.requireActive();
  let currentQuestion = null;
  let startTime = null;
  let pasteCount = 0;
  let roundTimerId = null;
  let monacoEditor = null;
  let codeByLanguage = {}; // preserves what the student typed per language when switching
  let resolveEditorReady;
  const editorReady = new Promise((resolve) => { resolveEditorReady = resolve; });

  const MONACO_LANG = { python3: 'python', cpp: 'cpp', java: 'java', javascript: 'javascript' };

  function getCode() {
    return monacoEditor ? monacoEditor.getValue() : document.getElementById('codeEditorFallback').value;
  }
  function setCode(value) {
    if (monacoEditor) monacoEditor.setValue(value || '');
    else document.getElementById('codeEditorFallback').value = value || '';
  }

  function updatePasteBadge() {
    const badge = document.getElementById('pasteBadge');
    if (pasteCount > 0) {
      badge.classList.add('flagged');
      badge.querySelector('span:last-child').textContent = `Paste detected (${pasteCount})`;
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
  }

  function initMonaco() {
    if (typeof require === 'undefined') { initFallbackEditor(); resolveEditorReady(); return; }
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      try {
        monacoEditor = monaco.editor.create(document.getElementById('monacoContainer'), {
          value: '',
          language: 'python',
          theme: 'vs-dark',
          automaticLayout: true,
          minimap: { enabled: false },
          fontSize: 18,
          scrollBeyondLastLine: false,
        });
        monacoEditor.getDomNode().addEventListener('paste', () => {
          pasteCount += 1;
          updatePasteBadge();
        });
      } catch (e) {
        initFallbackEditor();
      }
      resolveEditorReady();
    }, function () {
      // Monaco failed to load (e.g. no internet) — fall back to a plain textarea so the round still works.
      initFallbackEditor();
      resolveEditorReady();
    });
  }

  function initFallbackEditor() {
    document.getElementById('monacoContainer').style.display = 'none';
    const fallback = document.getElementById('codeEditorFallback');
    fallback.style.display = '';
    fallback.addEventListener('paste', () => {
      pasteCount += 1;
      updatePasteBadge();
    });
  }

  function renderStepper() {
    const labels = { aptitude: 'Aptitude', coding: 'Coding', theory: 'Theory' };
    const roundTypesInDrive = state.round_sequence.map(r => r.round_type);
    document.getElementById('stepper').innerHTML = roundTypesInDrive.map((type, i) => {
      const cls = i < state.roundIndex ? 'done' : (i === state.roundIndex ? 'active' : '');
      const num = i < state.roundIndex ? '✓' : (i + 1);
      const connector = i < roundTypesInDrive.length - 1 ? '<div class="connector"></div>' : '';
      return `<div class="step ${cls}"><span class="num">${num}</span><span class="label">${labels[type]}</span></div>${connector}`;
    }).join('');
  }

  function verdictClass(verdict) {
    if (verdict === 'Accepted') return 'pass';
    if (!verdict) return 'pending';
    return 'fail';
  }

  function renderTestCases(results) {
    document.getElementById('testcaseList').innerHTML = currentQuestion.test_cases.map((tc, i) => {
      const r = results ? results[i] : null;
      const statusClass = r ? verdictClass(r.verdict) : 'pending';
      const statusText = r ? (r.verdict || (r.passed ? 'Passed' : 'Failed')) : 'Not run';
      const perf = r && r.time_ms != null ? `<div class="tc-row mono" style="color:var(--ink-faint);">⏱ ${r.time_ms}ms &nbsp; 💾 ${Math.round((r.memory_kb||0)/1024)}MB</div>` : '';
      if (tc.hidden) {
        return `<div class="testcase"><div class="tc-head"><span>Test Case ${i + 1} (hidden)</span><span class="tc-status ${statusClass}">${statusText}</span></div><div class="tc-row">Input: — hidden until submission</div>${perf}</div>`;
      }
      return `<div class="testcase"><div class="tc-head"><span>Test Case ${i + 1}</span><span class="tc-status ${statusClass}">${statusText}</span></div><div class="tc-row">Input: ${tc.input}</div><div class="tc-row">Expected: ${tc.expected_output}</div>${perf}</div>`;
    }).join('');
  }

  async function loadQuestion() {
    if (!state) return;
    if (state.round_sequence[state.roundIndex].round_type !== 'coding') {
      window.location.href = Drive.nextRoundUrl(state);
      return;
    }
    document.getElementById('driveTitle').textContent = `Mock Drive — ${state.companyName}${state.driveName ? ` · ${state.driveName}` : ''}`;
    const spec = Drive.currentRoundSpec(state);
    document.getElementById('roundSub').textContent = `Round ${state.roundIndex + 1} of ${state.round_sequence.length} · Problem ${state.questionIndex + 1} of ${spec.question_count}`;
    renderStepper();

    try {
      currentQuestion = await Api.nextQuestion(state.sessionId, 'coding', spec.category, spec.difficulty, state.questionIndex);
      startTime = Date.now();
      pasteCount = 0;
      updatePasteBadge();

      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('codeShell').style.display = '';
      document.getElementById('qDifficulty').textContent = currentQuestion.difficulty;
      document.getElementById('qTitle').textContent = currentQuestion.title;
      document.getElementById('qDescription').textContent = currentQuestion.description;
      document.getElementById('qTags').innerHTML = (currentQuestion.tags || []).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
      const detailParts = [];
      if (currentQuestion.input_format) detailParts.push(`<p><strong>Input format</strong><br>${escapeHtml(currentQuestion.input_format)}</p>`);
      if (currentQuestion.output_format) detailParts.push(`<p><strong>Output format</strong><br>${escapeHtml(currentQuestion.output_format)}</p>`);
      if (currentQuestion.constraints && currentQuestion.constraints.length) {
        detailParts.push(`<p><strong>Constraints</strong></p><ul>${currentQuestion.constraints.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`);
      }
      if (currentQuestion.sample_input || currentQuestion.sample_output) {
        detailParts.push(`<p><strong>Sample input</strong></p><pre>${escapeHtml(currentQuestion.sample_input || '')}</pre><p><strong>Sample output</strong></p><pre>${escapeHtml(currentQuestion.sample_output || '')}</pre>`);
      }
      document.getElementById('problemDetails').innerHTML = detailParts.join('');
      setCode(currentQuestion.starter_code[document.getElementById('languageSelect').value] || '');
      codeByLanguage = {}; // fresh question — clear any per-language drafts from the previous one
      document.getElementById('languageSelect').dataset.prevValue = document.getElementById('languageSelect').value;
      document.getElementById('submitError').style.display = 'none';
      renderTestCases(null);
      if (!roundTimerId) roundTimerId = Drive.startRoundTimer(state, document.getElementById('roundTimer'));
    } catch (err) {
      document.getElementById('loadingMsg').textContent = err.message;
    }
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);
  }

  document.getElementById('languageSelect').addEventListener('change', (e) => {
    const newLang = e.target.value;
    const oldLang = e.target.dataset.prevValue || newLang;

    // remember whatever was typed in the language being left, so switching back restores it
    codeByLanguage[oldLang] = getCode();

    // load: whatever was previously typed in this language, or its default starter template
    const nextCode = codeByLanguage[newLang] !== undefined
      ? codeByLanguage[newLang]
      : (currentQuestion.starter_code[newLang] || '');
    setCode(nextCode);

    if (monacoEditor) {
      monaco.editor.setModelLanguage(monacoEditor.getModel(), MONACO_LANG[newLang] || 'plaintext');
    }
    e.target.dataset.prevValue = newLang;
  });

  document.getElementById('runCodeBtn').addEventListener('click', async () => {
    const btn = document.getElementById('runCodeBtn');
    const errorEl = document.getElementById('submitError');
    if (!getCode().trim()) {
      errorEl.textContent = 'Write some code before running it.';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Running…';
    try {
      const data = await Api.runCode({
        questionId: currentQuestion._id,
        code: getCode(),
        language: document.getElementById('languageSelect').value,
      });
      if (data.mockJudge) document.getElementById('mockNotice').style.display = '';
      renderTestCases(data.results);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Run Code';
    }
  });

  document.getElementById('nextBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('submitError');
    const code = getCode().trim();
    if (!code) {
      errorEl.textContent = 'Please write a solution before submitting.';
      errorEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('nextBtn');
    btn.disabled = true;
    btn.textContent = 'Scoring…';
    try {
      const timeTaken = Math.round((Date.now() - startTime) / 1000);
      await Api.submitRound(state.sessionId, {
        round_type: 'coding',
        question_id: currentQuestion._id,
        response: { code, language: document.getElementById('languageSelect').value },
        time_taken: timeTaken,
        tab_switch_count: window.proctorSwitchCount || 0,
        paste_count: pasteCount,
      });
      const result = await Drive.advance(state);
      if (result.done) {
        await Api.completeSession(state.sessionId);
        window.location.href = `drive-results.html?session=${state.sessionId}`;
      } else if (result.sameRound) {
        btn.disabled = false;
        btn.textContent = 'Submit & Continue →';
        loadQuestion();
      } else {
        window.location.href = Drive.nextRoundUrl(state);
      }
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit & Continue →';
    }
  });

  initMonaco();
  editorReady.then(loadQuestion).catch((err) => {
    document.getElementById('questionText').textContent = err.message;
  });
</script>
</body>
</html>
