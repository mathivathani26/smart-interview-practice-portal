<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="mock-drive.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mock Drive
      </a>
      <a href="practice.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Single Practice
      </a>
      <a href="leaderboard.html" class="side-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        Leaderboard
      </a>
      <a href="history.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        History
      </a>
      <a href="admin.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>
        Admin
      </a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong style="color:var(--on-navy);" id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Leaderboard</h1>
        <div class="sub">Ranked by score on the same company pattern.</div>
      </div>
      <div class="field" style="margin:0; min-width:200px;">
        <select id="companyFilter"></select>
      </div>
    </div>

    <div class="panel" id="leaderboardPanel">
      <p style="color:var(--ink-faint);">Loading…</p>
    </div>

    <p style="text-align:center; color:var(--ink-faint);" id="footNote"></p>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  Auth.requireAuth();
  let companies = [];

  async function loadLeaderboard(companyId) {
    const panel = document.getElementById('leaderboardPanel');
    panel.innerHTML = '<p style="color:var(--ink-faint);">Loading…</p>';
    try {
      const data = await Api.leaderboard(companyId);
      if (data.leaderboard.length === 0) {
        panel.innerHTML = '<p style="color:var(--ink-faint);">No completed mock drives for this company yet — be the first!</p>';
        document.getElementById('footNote').textContent = '';
        return;
      }
      panel.innerHTML = data.leaderboard.map(row => {
        const topClass = row.rank === 1 ? 'top1' : row.rank === 2 ? 'top2' : row.rank === 3 ? 'top3' : '';
        const meClass = row.isMe ? 'me' : '';
        return `<div class="leaderboard-row ${topClass} ${meClass}"><span class="rank">${row.rank}</span><span class="name">${row.isMe ? 'You' : row.name}</span><span class="lb-score">${row.score}%</span></div>`;
      }).join('');
      document.getElementById('footNote').textContent = `Showing top ${data.leaderboard.length} of ${data.totalParticipants} students who attempted the ${data.company} pattern.`;
    } catch (err) {
      panel.innerHTML = `<p class="error-text">${err.message}</p>`;
    }
  }

  (async function init() {
    try {
      companies = await Api.companies();
      const select = document.getElementById('companyFilter');
      select.innerHTML = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      select.addEventListener('change', () => loadLeaderboard(select.value));
      if (companies.length) loadLeaderboard(companies[0].id);
      else document.getElementById('leaderboardPanel').innerHTML = '<p style="color:var(--ink-faint);">No companies yet.</p>';
    } catch (err) {
      document.getElementById('leaderboardPanel').innerHTML = `<p class="error-text">${err.message}</p>`;
    }
  })();
</script>
</body>
</html>
