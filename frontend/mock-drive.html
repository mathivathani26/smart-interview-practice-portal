<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Drive — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="mock-drive.html" class="side-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mock Drive
      </a>
      <a href="practice.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Single Practice
      </a>
      <a href="leaderboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        Leaderboard
      </a>
      <a href="history.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        History
      </a>
      <a href="admin.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>
        Admin
      </a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong style="color:var(--on-navy);" id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Start a Mock Drive</h1>
        <div class="sub">Choose a company — you'll go through its exact round pattern in one sitting.</div>
      </div>
    </div>

    <div class="company-grid" id="companyGrid">
      <p style="color:var(--ink-faint);">Loading companies…</p>
    </div>

    <div style="margin-top:30px;">
      <button id="startDriveBtn" class="btn btn-primary btn-lg" disabled>Start Mock Drive →</button>
      <p style="max-width:68ch; color:var(--ink-faint);">Choose a published drive to see its independent Aptitude, Coding, and Theory rounds.</p>
      <p id="startDriveError" class="error-text" role="alert" aria-live="polite" hidden></p>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/drive.js?v=2"></script>
<script>
  Auth.requireAuth();

  const ICONS = { aptitude: "🧮", coding: "{ }", theory: "✎" };
  let selectedCompany = null;
  let selectedDrive = null;
  let companies = [];

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);
  }

  function renderCompanies() {
    const grid = document.getElementById('companyGrid');
    if (companies.length === 0) {
      grid.innerHTML = '<p style="color:var(--ink-faint);">No published drives are currently available.</p>';
      return;
    }
    grid.innerHTML = companies.map(c => {
      return `
        <div class="company-card" data-company-id="${c.id}">
          <h4>${escapeHtml(c.name)}</h4>
          <p class="company-sub">${escapeHtml(c.description)}</p>
          <div class="drive-choice-list">${c.drives.map(drive => {
            const rounds = ['aptitude', 'coding', 'theory'].map(type => {
              const spec = drive.round_sequence.find(round => round.round_type === type && round.enabled !== false);
              return `<div class="pi ${type} ${spec ? '' : 'off'}"><div class="pi-circle">${ICONS[type]}</div><span class="pi-count">${spec ? spec.question_count : '—'}</span></div>`;
            }).join('');
            return `<button type="button" class="drive-choice" data-drive-id="${escapeHtml(drive.id)}">
              <strong>${escapeHtml(drive.name)}</strong>
              <span class="pattern-icons">${rounds}</span>
            </button>`;
          }).join('')}</div>
        </div>`;
    }).join('');

    document.querySelectorAll('.drive-choice').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.drive-choice').forEach(item => item.classList.remove('selected'));
        button.classList.add('selected');
        selectedCompany = companies.find(company => company.drives.some(drive => drive.id === button.dataset.driveId));
        selectedDrive = selectedCompany.drives.find(drive => drive.id === button.dataset.driveId);
        const startButton = document.getElementById('startDriveBtn');
        startButton.disabled = false;
        startButton.textContent = `Start ${selectedDrive.name} →`;
      });
    });
  }

  (async function load() {
    try {
      companies = await Api.companies();
      renderCompanies();
    } catch (err) {
      document.getElementById('companyGrid').innerHTML = `<p class="error-text">${err.message}</p>`;
    }
  })();

  document.getElementById('startDriveBtn').addEventListener('click', async (e) => {
    if (!selectedCompany) return;
    const btn = e.currentTarget;
    const error = document.getElementById('startDriveError');
    error.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
      const data = await Api.startSession({ mode: 'mock_drive', driveId: selectedDrive.id });
      Drive.save({
        sessionId: data.sessionId,
        companyName: data.company.name,
        driveName: data.drive.name,
        round_sequence: data.round_sequence,
        roundIndex: 0,
        questionIndex: 0,
      });
      window.location.href = Drive.nextRoundUrl(Drive.get());
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Start Mock Drive →';
    }
  });
</script>
</body>
</html>
