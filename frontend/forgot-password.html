<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — Smart Interview Practice Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <nav class="site-nav">
      <div class="wrap">
        <a href="index.html" class="brand">
          <span class="brand-mark">SI</span>
          <span class="brand-name">Smart Interview Practice Portal</span>
        </a>
      </div>
    </nav>
    <main class="auth-form-col">
      <section class="auth-form">
        <h1>Reset your password</h1>
        <p>Enter the email address you use to log in, then choose a new password.</p>
        <form id="forgotPasswordForm" novalidate>
          <div class="field">
            <label for="email">Registered email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@college.edu" required>
          </div>
          <button type="button" class="btn btn-primary btn-block btn-lg" id="continueButton">Continue</button>

          <div id="passwordFields" hidden>
            <div class="field">
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm New Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <p id="resetMessage" class="status-message" role="alert" aria-live="polite" hidden></p>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetPasswordButton">Reset Password</button>
          </div>
        </form>
        <p class="auth-switch"><a class="btn btn-ghost btn-block btn-lg" href="login.html">Back to Login</a></p>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const passwordFields = document.getElementById('passwordFields');
    const continueButton = document.getElementById('continueButton');
    const passwordInput = document.getElementById('newPassword');
    const confirmInput = document.getElementById('confirmPassword');
    const message = document.getElementById('resetMessage');
    const resetButton = document.getElementById('resetPasswordButton');
    let resetSucceeded = false;

    function showMessage(text, success = false) {
      message.className = `status-message ${success ? 'status-success' : 'status-error'}`;
      message.textContent = text;
      message.hidden = false;
    }

    continueButton.addEventListener('click', () => {
      emailInput.value = emailInput.value.trim();
      if (!emailInput.value || !emailInput.validity.valid) {
        emailInput.setCustomValidity(emailInput.value ? 'Enter a valid email address.' : 'Enter your registered email address.');
        emailInput.reportValidity();
        emailInput.setCustomValidity('');
        return;
      }
      passwordFields.hidden = false;
      continueButton.hidden = true;
      passwordInput.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (passwordFields.hidden) {
        continueButton.click();
        return;
      }
      message.hidden = true;

      emailInput.value = emailInput.value.trim();
      if (!emailInput.value || !emailInput.validity.valid) {
        showMessage('Enter a valid registered email address.');
        emailInput.focus();
        return;
      }
      if (!passwordInput.value || !confirmInput.value) {
        showMessage('Enter and confirm your new password.');
        (!passwordInput.value ? passwordInput : confirmInput).focus();
        return;
      }
      if (passwordInput.value.length < 8) {
        showMessage('Your password must be at least 8 characters.');
        passwordInput.focus();
        return;
      }
      if (passwordInput.value !== confirmInput.value) {
        showMessage('The new password and confirmation do not match.');
        confirmInput.focus();
        return;
      }

      resetButton.disabled = true;
      try {
        const result = await Api.resetPassword({
          email: emailInput.value,
          password: passwordInput.value,
          confirmPassword: confirmInput.value,
        });
        showMessage(result.message, true);
        form.querySelectorAll('input').forEach((input) => { input.disabled = true; });
        resetSucceeded = true;
        resetButton.hidden = true;
      } catch (error) {
        showMessage(error.message);
      } finally {
        if (!resetSucceeded) resetButton.disabled = false;
      }
    });
  </script>
</body>
</html>
