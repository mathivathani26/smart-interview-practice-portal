<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptitude Round — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
      <a href="mock-drive.html" class="side-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Mock Drive</a>
      <a href="practice.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>Single Practice</a>
      <a href="leaderboard.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>Leaderboard</a>
      <a href="history.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>History</a>
      <a href="admin.html" class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>Admin</a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1 id="driveTitle">Mock Drive</h1>
        <div class="sub" id="roundSub">Loading…</div>
      </div>
      <span class="proctor-badge" data-proctor-badge><span class="dot"></span><span class="proctor-label">Proctoring active</span></span>
    </div>

    <div class="stepper" id="stepper"></div>

    <div class="mcq-card" id="mcqCard" style="display:none;">
      <div class="q-meta">
        <span id="qCategory"></span>
        <span class="timer"><span class="dot"></span><span id="qTimer">05:00</span></span>
      </div>
      <span class="category-tag" id="qCategoryTag"></span>
      <h2 id="qText"></h2>
      <div class="small-muted" id="progressLabel" aria-live="polite">0 / 0 answered</div>

      <div class="question-palette" id="questionPalette"></div>
      <div class="mcq-options" id="mcqOptions"></div>

      <p id="submitError" class="error-text" style="display:none;"></p>
      <div class="q-card-foot">
        <div class="flex-between full-width">
          <div class="nav-buttons">
            <button class="btn btn-ghost" id="prevBtn" type="button">Previous</button>
            <button class="btn btn-primary" id="nextBtn" type="button">Next →</button>
          </div>
          <button class="btn btn-primary" id="submitAptitudeBtn" type="button">Submit Aptitude Round</button>
        </div>
      </div>
    </div>
    <p id="loadingMsg" style="color:var(--ink-faint);">Loading question set…</p>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/drive.js?v=2"></script>
<script>
  Auth.requireAuth();
  const state = Drive.requireActive();
  let currentQuestion = null;
  let timerId = null;

  const spec = Drive.currentRoundSpec(state);

  function formatClock(totalSeconds) {
    const safe = Math.max(0, totalSeconds);
    const mins = String(Math.floor(safe / 60)).padStart(2, '0');
    const secs = String(safe % 60).padStart(2, '0');
    return `${mins}:${secs}`;
  }

  function renderStepper() {
    const labels = { aptitude: 'Aptitude', coding: 'Coding', theory: 'Theory' };
    const roundTypesInDrive = state.round_sequence.map(r => r.round_type);
    const html = roundTypesInDrive.map((type, i) => {
      const cls = i < state.roundIndex ? 'done' : (i === state.roundIndex ? 'active' : '');
      const num = i < state.roundIndex ? '✓' : (i + 1);
      const connector = i < roundTypesInDrive.length - 1 ? '<div class="connector"></div>' : '';
      return `<div class="step ${cls}"><span class="num">${num}</span><span class="label">${labels[type]}</span></div>${connector}`;
    }).join('');
    document.getElementById('stepper').innerHTML = html;
  }

  function renderQuestionPalette() {
    const palette = document.getElementById('questionPalette');
    if (!palette || !state.aptitudeQuestions || !state.aptitudeQuestions.length) return;

    palette.innerHTML = state.aptitudeQuestions.map((question, index) => {
      const selected = state.aptitudeAnswers[question._id] || [];
      const isCurrent = index === state.questionIndex;
      const isAnswered = selected.length > 0;
      const classes = ['q-index-btn', isCurrent ? 'current' : '', isAnswered ? 'answered' : 'unanswered'].join(' ').trim();
      return `<button type="button" class="${classes}" data-index="${index}">${index + 1}</button>`;
    }).join('');

    palette.querySelectorAll('[data-index]').forEach(btn => {
      btn.addEventListener('click', () => {
        const index = Number(btn.dataset.index);
        if (Number.isInteger(index)) {
          state.questionIndex = index;
          Drive.save(state);
          renderQuestion();
        }
      });
    });
  }

  function updateProgressLabel() {
    const total = state.aptitudeQuestions.length || spec.question_count || 1;
    const answered = Object.values(state.aptitudeAnswers || {}).filter((answers) => Array.isArray(answers) && answers.length > 0).length;
    const el = document.getElementById('progressLabel');
    if (el) {
      el.textContent = `${answered} / ${total} answered`;
    }
  }

  function renderQuestion() {
    if (!state.aptitudeQuestions || !state.aptitudeQuestions.length) return;
    currentQuestion = state.aptitudeQuestions[state.questionIndex];
    if (!currentQuestion) return;

    document.getElementById('driveTitle').textContent = `Mock Drive — ${state.companyName || 'Interview'}`;
    document.getElementById('roundSub').textContent = `Round ${state.roundIndex + 1} of ${state.round_sequence.length} · Question ${state.questionIndex + 1} of ${state.aptitudeQuestions.length}`;
    renderStepper();

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('mcqCard').style.display = '';
    document.getElementById('qCategory').textContent = `Aptitude · ${currentQuestion.category}`;
    document.getElementById('qCategoryTag').textContent = (currentQuestion.category || 'Aptitude').charAt(0).toUpperCase() + (currentQuestion.category || 'Aptitude').slice(1) + ' Aptitude';
    document.getElementById('qText').textContent = currentQuestion.question_text;
    document.getElementById('submitError').style.display = 'none';

    const allowsMultipleAnswers = currentQuestion.multiple_answers === true
      || (Array.isArray(currentQuestion.correct_options) && currentQuestion.correct_options.length > 1);
    const savedAnswers = state.aptitudeAnswers[currentQuestion._id] || [];
    const selected = allowsMultipleAnswers ? savedAnswers : savedAnswers.slice(0, 1);
    if (selected.length !== savedAnswers.length) {
      state.aptitudeAnswers[currentQuestion._id] = selected;
      Drive.save(state);
    }
    const optionsEl = document.getElementById('mcqOptions');
    const letters = ['A', 'B', 'C', 'D', 'E'];
    optionsEl.innerHTML = (currentQuestion.options || []).map((opt, i) => `
      <label class="mcq-option ${selected.includes(opt) ? 'selected' : ''}">
        <input type="${allowsMultipleAnswers ? 'checkbox' : 'radio'}" name="aptitudeOption" value="${opt.replace(/"/g, '&quot;')}" ${selected.includes(opt) ? 'checked' : ''}>
        <span class="letter">${letters[i]}</span>
        <span>${opt}</span>
      </label>`).join('');

    optionsEl.querySelectorAll('input[name="aptitudeOption"]').forEach((input) => {
      input.addEventListener('change', () => {
        const checked = [...optionsEl.querySelectorAll('input[name="aptitudeOption"]:checked')].map((item) => item.value);
        state.aptitudeAnswers[currentQuestion._id] = checked;
        Drive.save(state);
        renderQuestionPalette();
        updateProgressLabel();
        optionsEl.querySelectorAll('.mcq-option').forEach((label) => {
          const box = label.querySelector('input');
          label.classList.toggle('selected', box.checked);
        });
      });
    });

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = state.questionIndex === 0;
    nextBtn.textContent = state.questionIndex === state.aptitudeQuestions.length - 1 ? 'Finish Aptitude →' : 'Next →';

    renderQuestionPalette();
    updateProgressLabel();
  }

  function startTimer() {
    if (timerId) clearInterval(timerId);
    state.aptitudeDeadline = state.aptitudeDeadline || Date.now() + (spec.time_limit_seconds || 300) * 1000;
    Drive.save(state);

    const tick = () => {
      const remaining = Math.max(0, Math.ceil((state.aptitudeDeadline - Date.now()) / 1000));
      document.getElementById('qTimer').textContent = formatClock(remaining);
      if (remaining <= 0) {
        clearInterval(timerId);
        submitAptitudeRound(true);
      }
    };

    tick();
    timerId = setInterval(tick, 1000);
  }

  async function submitAptitudeRound(autoSubmit = false) {
    if (state.aptitudeSubmitting) return;
    state.aptitudeSubmitting = true;
    Drive.save(state);

    const unanswered = state.aptitudeQuestions.filter((question) => {
      const selected = state.aptitudeAnswers[question._id] || [];
      return selected.length === 0;
    }).length;

    if (!autoSubmit && unanswered > 0) {
      const confirmSubmit = window.confirm(`You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. Submit anyway?`);
      if (!confirmSubmit) {
        state.aptitudeSubmitting = false;
        Drive.save(state);
        return;
      }
    }

    try {
      const submissions = state.aptitudeQuestions.map((question) => {
        const selected = state.aptitudeAnswers[question._id] || [];
        return Api.submitRound(state.sessionId, {
          round_type: 'aptitude',
          question_id: question._id,
          response: { selected_options: selected },
          time_taken: Math.round((Date.now() - (state.aptitudeStartedAt || Date.now())) / 1000),
          tab_switch_count: window.proctorSwitchCount || 0,
        });
      });

      await Promise.all(submissions);

      clearInterval(timerId);
      state.roundIndex += 1;
      state.questionIndex = 0;
      state.aptitudeQuestions = [];
      state.aptitudeAnswers = {};
      delete state.aptitudeDeadline;
      delete state.aptitudeStartedAt;
      delete state.aptitudeSubmitting;
      Drive.save(state);

      if (state.roundIndex >= state.round_sequence.length) {
        await Api.completeSession(state.sessionId);
        window.location.href = `drive-results.html?session=${state.sessionId}`;
        return;
      }

      window.location.href = Drive.nextRoundUrl(state);
    } catch (err) {
      document.getElementById('submitError').textContent = err.message;
      document.getElementById('submitError').style.display = 'block';
      state.aptitudeSubmitting = false;
      Drive.save(state);
    }
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (state.questionIndex > 0) {
      state.questionIndex -= 1;
      Drive.save(state);
      renderQuestion();
    }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (state.questionIndex < state.aptitudeQuestions.length - 1) {
      state.questionIndex += 1;
      Drive.save(state);
      renderQuestion();
    } else {
      submitAptitudeRound(false);
    }
  });

  document.getElementById('submitAptitudeBtn').addEventListener('click', () => submitAptitudeRound(false));

  async function initAptitudeRound() {
    if (state.round_sequence[state.roundIndex].round_type !== 'aptitude') {
      window.location.href = Drive.nextRoundUrl(state);
      return;
    }

    state.aptitudeAnswers = state.aptitudeAnswers || {};
    state.questionIndex = Number.isInteger(state.questionIndex) ? state.questionIndex : 0;

    try {
      if (!Array.isArray(state.aptitudeQuestions) || state.aptitudeQuestions.length === 0) {
        state.aptitudeQuestions = await Api.aptitudeSet(state.sessionId, spec.category, spec.difficulty, spec.question_count || 10);
      }
      if (state.questionIndex >= state.aptitudeQuestions.length) {
        state.questionIndex = 0;
      }
      state.aptitudeStartedAt = state.aptitudeStartedAt || Date.now();
      Drive.save(state);
      renderQuestion();
      startTimer();
    } catch (err) {
      document.getElementById('loadingMsg').textContent = err.message;
    }
  }

  initAptitudeRound();
</script>
</body>
</html>
