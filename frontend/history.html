<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — Smart Interview Practice Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark" style="background:rgba(238,238,228,.14);">SI</span><span class="brand-name">Smart Interview</span></a>
    <nav>
      <a href="dashboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="mock-drive.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mock Drive
      </a>
      <a href="practice.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Single Practice
      </a>
      <a href="leaderboard.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        Leaderboard
      </a>
      <a href="history.html" class="side-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        History
      </a>
      <a href="admin.html" class="side-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>
        Admin
      </a>
    </nav>
    <div class="side-user">
      <span class="avatar" id="sideAvatar">--</span>
      <div><strong style="color:var(--on-navy);" id="sideName">Loading…</strong><small id="sideEmail"></small></div>
    </div>
    <button class="side-logout" data-logout>Log out</button>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Interview History</h1>
        <div class="sub">Every session you've completed, reviewable anytime.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Mock Drives</h3></div>
      <table class="history">
        <thead><tr><th>Date</th><th>Company</th><th>Aptitude</th><th>Coding</th><th>Theory</th><th>Overall</th><th></th></tr></thead>
        <tbody id="drivesBody"><tr><td colspan="7" style="color:var(--ink-faint);">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Single-Question Practice</h3></div>
      <table class="history">
        <thead><tr><th>Date</th><th>Score</th><th></th></tr></thead>
        <tbody id="practiceBody"><tr><td colspan="3" style="color:var(--ink-faint);">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  Auth.requireAuth();

  (async function load() {
    try {
      const sessions = await Api.history();
      const drives = sessions.filter(s => s.mode === 'mock_drive');
      const singles = sessions.filter(s => s.mode === 'single_question');

      const drivesBody = document.getElementById('drivesBody');
      drivesBody.innerHTML = drives.length ? drives.map(s => `
        <tr>
          <td>${new Date(s.completed_at).toLocaleDateString()}</td>
          <td>${s.company || '—'}${s.drive_name ? ` · ${s.drive_name}` : ''}</td>
          <td>${s.round_scores.aptitude != null ? s.round_scores.aptitude + '%' : '—'}</td>
          <td>${s.round_scores.coding != null ? s.round_scores.coding + '%' : '—'}</td>
          <td>${s.round_scores.theory != null ? s.round_scores.theory + '%' : '—'}</td>
          <td class="score">${s.total_score}%</td>
          <td><a href="drive-results.html?session=${s.id}" class="btn btn-ghost btn-sm">View</a></td>
        </tr>`).join('') : '<tr><td colspan="7" style="color:var(--ink-faint);">No mock drives yet.</td></tr>';

      const practiceBody = document.getElementById('practiceBody');
      practiceBody.innerHTML = singles.length ? singles.map(s => `
        <tr>
          <td>${new Date(s.completed_at).toLocaleDateString()}</td>
          <td class="score">${s.total_score}%</td>
          <td><a href="results.html?session=${s.id}" class="btn btn-ghost btn-sm">View</a></td>
        </tr>`).join('') : '<tr><td colspan="3" style="color:var(--ink-faint);">No single-question sessions yet.</td></tr>';
    } catch (err) {
      document.getElementById('drivesBody').innerHTML = `<tr><td colspan="7" class="error-text">${err.message}</td></tr>`;
    }
  })();
</script>
</body>
</html>
